<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">AI systems architecture — from data to application</title>
  <desc id="desc">Conceptual engineering flow: data, context and features, model or LLM, evaluation, application. The model connects to four capabilities: RAG for retrieval, tools for actions, MCP for interfaces, and agents for orchestration. These are shared design patterns, not a deployment topology for every project.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" stroke="#AAB7C8" stroke-width="1.5" fill="none"/></marker>
  </defs>
  <rect x=".5" y=".5" width="999" height="339" rx="14" fill="#0D131C" stroke="#354151"/>
  <g font-family="'Courier New', monospace" font-size="13" letter-spacing="1.3">
    <text x="32" y="33" fill="#EF777B">SYSTEM FLOW / DATA TO DECISIONS</text>
    <text x="968" y="33" text-anchor="end" fill="#AAB7C8">CONCEPTUAL ARCHITECTURE</text>
  </g>
  <path d="M32 53H968" stroke="#303A47"/>
  <g fill="#171E29" stroke="#354151">
    <rect x="32" y="78" width="168" height="104" rx="8"/>
    <rect x="224" y="78" width="168" height="104" rx="8"/>
    <rect x="416" y="78" width="168" height="104" rx="8" stroke="#EF686D"/>
    <rect x="608" y="78" width="168" height="104" rx="8"/>
    <rect x="800" y="78" width="168" height="104" rx="8"/>
  </g>
  <g stroke="#AAB7C8" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M203 130H219"/><path d="M395 130H411"/>
    <path d="M587 130H603"/><path d="M779 130H795"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g font-size="19" font-weight="700" fill="#F3F6FA">
      <text x="116" y="113">DATA</text>
      <text x="308" y="113">CONTEXT</text>
      <text x="500" y="113">MODEL / LLM</text>
      <text x="692" y="113">EVALUATION</text>
      <text x="884" y="113">APPLICATION</text>
    </g>
    <g font-size="14" fill="#B9C5D3">
      <text x="116" y="141">Ingest &amp; normalize</text><text x="116" y="162">Preserve provenance</text>
      <text x="308" y="141">Features &amp; evidence</text><text x="308" y="162">Respect time cutoffs</text>
      <text x="500" y="141">Predict &amp; reason</text><text x="500" y="162">Ground outputs</text>
      <text x="692" y="141">Test &amp; measure</text><text x="692" y="162">Check uncertainty</text>
      <text x="884" y="141">APIs &amp; interfaces</text><text x="884" y="162">Support decisions</text>
    </g>
  </g>
  <path d="M500 183V214M230 233V214H770V233M410 214V233M590 214V233" stroke="#EF686D" stroke-width="1.5"/>
  <g fill="#121923" stroke="#354151">
    <rect x="148" y="233" width="164" height="66" rx="7"/>
    <rect x="328" y="233" width="164" height="66" rx="7"/>
    <rect x="508" y="233" width="164" height="66" rx="7"/>
    <rect x="688" y="233" width="164" height="66" rx="7"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g font-size="18" font-weight="700" fill="#F3F6FA">
      <text x="230" y="259">RAG</text><text x="410" y="259">TOOLS</text>
      <text x="590" y="259">MCP</text><text x="770" y="259">AGENTS</text>
    </g>
    <g font-size="14" fill="#B9C5D3">
      <text x="230" y="282">Retrieval</text><text x="410" y="282">Actions</text>
      <text x="590" y="282">Interfaces</text><text x="770" y="282">Orchestration</text>
    </g>
  </g>
  <text x="500" y="324" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#95A3B5">SHARED PATTERNS / CAPABILITIES VARY BY SYSTEM</text>
</svg>
