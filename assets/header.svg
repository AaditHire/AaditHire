<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Aadit Hire // Pit Wall — AI / ML Engineer</title>
  <desc id="desc">Mumbai-based AI/ML engineer building intelligent systems that turn data into decisions. Original race-control interface with illustrative telemetry, agentic systems, RAG and MCP, and a George Russell fan reference. Status indicators are decorative, not live monitoring.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#222A34" stroke-opacity=".45"/>
    </pattern>
    <linearGradient id="surface" x1="0" y1="0" x2="1000" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141B24"/>
      <stop offset="1" stop-color="#090D13"/>
    </linearGradient>
    <clipPath id="bounds"><rect width="1000" height="460" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1000" height="460" fill="url(#surface)"/>
    <rect width="1000" height="460" fill="url(#grid)"/>
    <path d="M0 0H1000" stroke="#EF5358" stroke-width="6"/>
    <path d="M36 63H964M36 380H964" stroke="#303A47"/>

    <g font-family="'Courier New', monospace" font-size="13" letter-spacing="1.5">
      <text x="36" y="39" fill="#BEC9D7">AH / ENGINEERING SYSTEMS</text>
      <text x="964" y="39" text-anchor="end" fill="#A7B5C6">MUMBAI, INDIA</text>
    </g>

    <text x="36" y="104" fill="#EF777B" font-family="'Courier New', monospace" font-size="14" letter-spacing="3">DATA. CONTEXT. DECISIONS.</text>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
      <text x="33" y="167" fill="#F3F6FA" font-size="57" letter-spacing="-1.5">AADIT HIRE</text>
      <text x="37" y="203" fill="#B2BECC" font-size="24" letter-spacing="5">// PIT WALL</text>
      <text x="36" y="254" fill="#F3F6FA" font-size="27">AI / ML ENGINEER</text>
    </g>
    <text x="36" y="285" fill="#B9C5D3" font-family="'Courier New', monospace" font-size="14">AGENTIC SYSTEMS / RAG / MCP</text>

    <rect x="640" y="86" width="324" height="204" rx="8" fill="#0D131C" stroke="#354151"/>
    <path d="M640 123H964" stroke="#354151"/>
    <g font-family="'Courier New', monospace" font-size="14">
      <text x="658" y="110" fill="#C8D2DE" letter-spacing="1.5">CONTROL PANEL</text>
      <text x="946" y="110" text-anchor="end" fill="#95A3B5" font-size="11">CONCEPT UI</text>
      <g fill="#AAB7C8">
        <text x="658" y="153">RACE CONTROL</text>
        <text x="658" y="189">AI CORE</text>
        <text x="658" y="225">TRACK STATUS</text>
        <text x="658" y="261">LOCATION</text>
      </g>
      <g fill="#A2E0C1" text-anchor="end">
        <text x="946" y="153">ONLINE</text>
        <text x="946" y="189">ONLINE</text>
        <text x="946" y="225">GREEN</text>
      </g>
      <text x="946" y="261" text-anchor="end" fill="#F3F6FA">MUMBAI</text>
    </g>
    <g fill="#A2E0C1">
      <circle cx="866" cy="148" r="3"/>
      <circle cx="866" cy="184" r="3"/>
      <circle cx="866" cy="220" r="3"/>
    </g>

    <!-- Original illustrative trace; no race data or measured performance implied. -->
    <path d="M640 338H964" stroke="#354151" stroke-dasharray="3 6"/>
    <path d="M640 344L682 344L704 330L729 330L747 309L765 352L782 326L815 326L836 314L862 314L883 337L912 337L932 318L964 318" stroke="#EF686D" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="964" cy="318" r="4" fill="#EF686D"/>
    <text x="640" y="366" fill="#95A3B5" font-family="'Courier New', monospace" font-size="10" letter-spacing="1.2">SIGNAL TRACE / ILLUSTRATIVE</text>

    <g font-family="'Courier New', monospace">
      <text x="36" y="321" fill="#EF777B" font-size="12" letter-spacing="2">CURRENT MISSION</text>
      <text x="36" y="344" fill="#DCE4EE" font-size="16">BUILDING INTELLIGENT SYSTEMS</text>
      <text x="36" y="366" fill="#DCE4EE" font-size="16">THAT TURN DATA INTO DECISIONS</text>
      <text x="36" y="412" fill="#CFD8E4" font-size="12" letter-spacing="1">RACE STRATEGY / FINANCIAL ML / AI INFRASTRUCTURE</text>
      <text x="36" y="437" fill="#95A3B5" font-size="11">ENGINEER BY PRACTICE. MOTORSPORT FAN BY INSTINCT.</text>
      <text x="964" y="413" text-anchor="end" fill="#D7E1EE" font-size="13">GEORGE RUSSELL</text>
      <text x="964" y="436" text-anchor="end" fill="#95A3B5" font-size="11" letter-spacing="1">FAN CHANNEL / OPEN</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="459" rx="15.5" stroke="#354151"/>
</svg>
