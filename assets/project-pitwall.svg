<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">F1 Virtual Pitwall V2 — flagship race-strategy system</title>
  <desc id="desc">Active development. Leakage-controlled historical replay. Held-out 5-lap PIT transition MAE improved from 6.789 seconds to 5.207 seconds. Reported validation: 97 offline and 21 live tests. Python, FastAPI, FastF1, Pydantic.</desc>
