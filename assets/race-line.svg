<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The development lap — idea, data, model, evaluate, deploy</title>
  <desc id="desc">An original miniature race car completes a development circuit through idea, data, model, evaluation, and deployment, then returns for the next iteration. Motion stops when reduced motion is preferred. Decorative race-control footer: session active, system nominal, next objective build.</desc>
  <style>
    @supports (offset-path: path('M0 0H1')) {
      .car { transform: translate(0, 0); offset-path: path('M100 100 H900 C945 100 945 164 900 164 H100 C55 164 55 100 100 100 Z'); offset-rotate: auto; animation: lap 16s linear infinite; }
    }
    @keyframes lap { to { offset-distance: 100%; } }
    @media (prefers-reduced-motion: reduce) { .car { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="999" height="229" rx="14" fill="#0D131C" stroke="#354151"/>
  <g font-family="'Courier New', monospace" font-size="13" letter-spacing="1.5">
    <text x="32" y="33" fill="#EF777B">THE DEVELOPMENT LAP</text>
    <text x="968" y="33" text-anchor="end" fill="#AAB7C8">BUILD / MEASURE / ITERATE</text>
  </g>
  <path d="M100 100H900C945 100 945 164 900 164H100C55 164 55 100 100 100Z" stroke="#242F3D" stroke-width="14"/>
  <path d="M100 100H900C945 100 945 164 900 164H100C55 164 55 100 100 100Z" stroke="#66768B" stroke-width="1" stroke-dasharray="4 7"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#F3F6FA">
    <text x="100" y="77">IDEA</text><text x="300" y="77">DATA</text>
    <text x="500" y="77">MODEL</text><text x="700" y="77">EVALUATE</text>
    <text x="900" y="77">DEPLOY</text>
  </g>
  <g fill="#EF777B"><circle cx="100" cy="100" r="3"/><circle cx="300" cy="100" r="3"/><circle cx="500" cy="100" r="3"/><circle cx="700" cy="100" r="3"/><circle cx="900" cy="100" r="3"/></g>
  <text x="500" y="139" text-anchor="middle" fill="#AAB7C8" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.5">EVERY LAP INFORMS THE NEXT.</text>
  <!-- Base transform keeps the car on the circuit if CSS motion paths are unavailable. -->
  <g class="car" transform="translate(100 100)">
    <path d="M-10-5H7L14 0L7 5H-10Z" fill="#EF686D"/>
    <rect x="-11" y="-9" width="5" height="6" rx="1" fill="#DCE4EE"/>
    <rect x="-11" y="3" width="5" height="6" rx="1" fill="#DCE4EE"/>
    <rect x="6" y="-8" width="4" height="5" rx="1" fill="#DCE4EE"/>
    <rect x="6" y="3" width="4" height="5" rx="1" fill="#DCE4EE"/>
    <rect x="-3" y="-3" width="6" height="6" rx="2" fill="#0D131C"/>
  </g>
  <path d="M32 187H968" stroke="#303A47"/>
  <g font-family="'Courier New', monospace" font-size="12" fill="#B9C5D3">
    <text x="32" y="213">SESSION / ACTIVE</text>
    <text x="500" y="213" text-anchor="middle">SYSTEM / NOMINAL</text>
    <text x="968" y="213" text-anchor="end" fill="#EF777B">NEXT OBJECTIVE / BUILD</text>
  </g>
</svg>
