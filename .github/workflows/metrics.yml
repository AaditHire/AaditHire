name: GitHub Metrics

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  metrics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Profile statistics and languages
        uses: lowlighter/metrics@latest
        with:
          user: AaditHire
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          committer_branch: main
          filename: github-metrics.svg
          template: classic
          base: header, repositories
          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          config_timezone: Asia/Kolkata
          config_animations: no
          optimize: css, xml
          plugins_errors_fatal: yes
      - name: Full-year contribution calendar
        uses: lowlighter/metrics@latest
        with:
          user: AaditHire
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          committer_branch: main
          filename: github-contributions.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata
          config_animations: no
          optimize: css, xml
          plugins_errors_fatal: yes
